<!DOCTYPE html>
<html>
<head>
  <title>Ficha Jugador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-size: 20px;
      text-align: center;
    }

    #foto {
      width: 80%;
      max-width: 300px;
    }
  </style>
</head>
<body>

<h1>Ficha del Jugador</h1>

<p id="nombre">Nombre: ---</p>
<p id="dni">DNI: ---</p>
<p id="carnet">Carnet: ---</p>

<h2>Llamar en caso de Emergencia</h2>
<p id="eganro">Nro: ---</p>
<p id="eganom">Nombre: ---</p>
<p id="egaparen">Parentesco: ---</p>

<img id="foto" width="150">

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("jugadores.json")
  .then(response => response.json())
  .then(data => {
    const jugador = data.find(j => j.id == id);

    if (jugador) {
      document.getElementById("nombre").textContent = "Nombre: " + jugador.nombre;

      const dni = jugador.dni.toString();
      const ultimos = dni.slice(-3);
      const dniParcial = "*".repeat(dni.length - 3) + ultimos;

      document.getElementById("dni").textContent = "DNI: " + dniParcial;
      document.getElementById("carnet").textContent = "Carnet: " + jugador.carnet;
      if (jugador.EGAnro) {
  document.getElementById("eganro").innerHTML =
    'Nro: <a href="tel:' + jugador.EGAnro + '">' + jugador.EGAnro + '</a>';

  document.getElementById("eganom").textContent = "Nombre: " + jugador.EGAnom;
  document.getElementById("egaparen").textContent = "Parentesco: " + jugador.EGAparen;
} else {
  document.getElementById("eganro").textContent = "Datos no registrados";
  document.getElementById("eganom").textContent = "";
  document.getElementById("egaparen").textContent = "";
}

      document.getElementById("foto").src = "imagenes/" + jugador.id + ".jpg";
    } else {
      document.getElementById("nombre").textContent = "Jugador no encontrado";
    }
  });
</script>

</body>
</html>
